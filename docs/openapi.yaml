openapi: 3.1.0
info:
  title: Pushboy API
  version: 0.1.0
  summary: Self-hosted APNS, FCM, and Live Activity delivery API.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
  description: |
    Pushboy exposes a small HTTP API for users, device tokens, topics,
    notification jobs, and Live Activity dispatches. The /v2 key, user, and topic
    routes authenticate tenant server keys. The legacy /v1 routes remain
    unauthenticated and globally scoped. Deploy behind a trusted backend or private network.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: ServerKeys
  - name: Health
  - name: Users
  - name: Tokens
  - name: Topics
  - name: Subscriptions
  - name: Notifications
  - name: LiveActivity
security: []
paths:
  /v2/keys:
    post:
      tags: [ServerKeys]
      summary: Issue a server key for the authenticated app tenant
      description: |
        Requires keys:manage. The bearer key determines the tenant and bounds
        the new key's scopes and expiry. Existing keys stay active until expiry
        or revocation.
      security:
        - TenantServerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes]
              properties:
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum: [read, send, "users:write", "devices:write", "topics:write", "keys:manage", "providers:manage"]
                expiresAt:
                  type: [string, "null"]
                  format: date-time
                  description: Future expiry at or before the issuer's expiry. Omit or pass null for an unbounded key only if the issuer has no expiry.
      responses:
        "201":
          description: Key issued.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, key]
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                    description: Secret shown only in this response.
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          description: Missing, malformed, invalid, expired, or revoked bearer key, or disabled tenant.
        "403":
          description: Missing keys:manage or the requested scopes or expiry exceed the issuer's authority.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/keys/{keyId}:
    delete:
      tags: [ServerKeys]
      summary: Revoke a server key within the authenticated tenant
      description: |
        Requires keys:manage. Revocation takes effect on subsequent authentication.
      security:
        - TenantServerKey: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Key revoked or already revoked.
        "401":
          description: Missing or invalid bearer key, or inactive key or tenant.
        "403":
          description: Missing keys:manage.
        "404":
          description: Key does not exist within the authenticated tenant.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/users:
    post:
      operationId: createTenantUser
      tags: [Users]
      summary: Create a user in the authenticated app tenant
      description: |
        Requires users:write. Omit identity or set it to null to create an
        anonymous user. A supplied identity creates an identified user.
        Pushboy generates the canonical UID. Invalid UTF-8 and unpaired
        surrogate escapes return 400.
      security:
        - TenantServerKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: |
            A single hyphenated UUID for retrying this create request. In the
            same tenant, retrying with this key and the same identity returns
            the original user. An omitted or null identity counts as anonymous.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                identity:
                  type: [object, "null"]
                  additionalProperties: false
                  required: [namespace, externalId]
                  properties:
                    namespace:
                      type: string
                      minLength: 1
                      maxLength: 128
                      description: Exact identity namespace. The legacy namespace is reserved in all capitalizations.
                    externalId:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: Exact external account identifier in this namespace.
            examples:
              anonymous:
                value: {}
              identified:
                value:
                  identity:
                    namespace: accounts
                    externalId: account-42
      responses:
        "201":
          description: User created or returned from the original request with this idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "409":
          description: The identity already belongs to a user in this tenant, or this idempotency key was used with a different identity.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/users/{uid}:
    get:
      operationId: getTenantUser
      tags: [Users]
      summary: Get a user by canonical UID
      description: Requires read. Returns the user within the authenticated tenant.
      security:
        - TenantServerKey: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User in the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "500":
          $ref: "#/components/responses/TextError"

  /v2/topics:
    post:
      operationId: createTenantTopic
      tags: [Topics]
      summary: Create a topic in the authenticated app tenant
      description: |
        Requires topics:write. Topic IDs and names match exactly and are unique
        within the tenant. Invalid UTF-8 and unpaired surrogate escapes return 400.
      security:
        - TenantServerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  not:
                    enum: [".", ".."]
                  example: releases
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Release notes
      responses:
        "201":
          description: Topic created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTopic"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "409":
          description: The topic ID or name already exists in this tenant.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/topics/{topicId}:
    get:
      operationId: getTenantTopic
      tags: [Topics]
      summary: Get a topic by ID
      description: Requires read. Returns the topic within the authenticated tenant.
      security:
        - TenantServerKey: []
      parameters:
        - name: topicId
          in: path
          required: true
          description: Exact topic ID, percent-encoded as a path segment.
          schema:
            type: string
      responses:
        "200":
          description: Topic in the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTopic"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/ping:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /v1/users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users ordered by creation time descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
        "400":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/:
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Users]
      summary: Get a user
      responses:
        "200":
          description: User found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        "204":
          description: User deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/tokens:
    post:
      tags: [Tokens]
      summary: Register a push token
      description: Creates the user if the provided id does not exist. Generates a user id if id is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTokenRequest"
      responses:
        "201":
          description: Token registered.
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    $ref: "#/components/schemas/Token"
        "400":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Tokens]
      summary: List a user's push tokens
      responses:
        "200":
          description: Tokens for the user. Unknown users currently return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Token"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/tokens/{tokenID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/TokenID"
    delete:
      tags: [Tokens]
      summary: Delete a push token
      description: The current handler deletes by tokenID; userID is part of the route but is not used for authorization.
      responses:
        "204":
          description: Token deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/subscriptions/{topicID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/TopicID"
    post:
      tags: [Subscriptions]
      summary: Subscribe a user to a topic
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTopicSubscription"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [Subscriptions]
      summary: Unsubscribe a user from a topic
      responses:
        "204":
          description: Subscription deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/subscriptions:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Subscriptions]
      summary: List a user's topic subscriptions
      responses:
        "200":
          description: Subscriptions for the user. Unknown users currently return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserTopicSubscription"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/notifications:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Notifications]
      summary: List notifications eligible for a user
      description: Returns direct user sends and topic sends where the user is currently subscribed and the job effective time is on or after the subscription time. This is eligibility, not delivery history.
      parameters:
        - $ref: "#/components/parameters/NotificationStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Eligible notification jobs ordered by effective time descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPublishJobs"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/send:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Notifications]
      summary: Send or schedule a notification to one user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedJobResponse"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

  /v1/topics/:
    get:
      tags: [Topics]
      summary: List topics
      responses:
        "200":
          description: Topics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
        "500":
          $ref: "#/components/responses/TextError"
    post:
      tags: [Topics]
      summary: Create a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
      responses:
        "201":
          description: Topic created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/topics/{topicID}:
    parameters:
      - $ref: "#/components/parameters/TopicID"
    get:
      tags: [Topics]
      summary: Get a topic
      responses:
        "200":
          description: Topic found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [Topics]
      summary: Delete a topic
      responses:
        "204":
          description: Topic deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          description: Topic is still referenced by a Live Activity channel.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/TextError"

  /v1/topics/{topicID}/count:
    parameters:
      - $ref: "#/components/parameters/TopicID"
    get:
      tags: [Topics]
      summary: Count topic subscribers
      responses:
        "200":
          description: Subscriber count. Missing topics currently can return 0.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    example: 42
        "500":
          $ref: "#/components/responses/TextError"

  /v1/topics/{topicID}/subscribers:
    parameters:
      - $ref: "#/components/parameters/TopicID"
    get:
      tags: [Subscriptions]
      summary: List topic subscribers
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Current subscribers ordered by subscription time descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTopicSubscribers"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/topics/{topicID}/notifications:
    parameters:
      - $ref: "#/components/parameters/TopicID"
    get:
      tags: [Notifications]
      summary: List notifications for a topic
      parameters:
        - $ref: "#/components/parameters/NotificationStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Topic notification jobs ordered by effective time descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPublishJobs"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/topics/{topicID}/publish:
    parameters:
      - $ref: "#/components/parameters/TopicID"
    post:
      tags: [Notifications]
      summary: Send or schedule a notification to a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedJobResponse"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

  /v1/notifications/{jobID}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [Notifications]
      summary: Get notification job
      responses:
        "200":
          description: Notification job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishJob"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/tokens:
    post:
      tags: [LiveActivity]
      summary: Register a Live Activity token
      description: FCM tokens are stored as update tokens. APNS update tokens are capped to the default Live Activity lifetime if no sooner expiry is provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterLiveActivityTokenRequest"
      responses:
        "201":
          description: Token registered.
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    $ref: "#/components/schemas/LiveActivityToken"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [LiveActivity]
      summary: Invalidate a Live Activity token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteLiveActivityTokenRequest"
      responses:
        "204":
          description: Token invalidated.
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/topics/{topicID}/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/TopicID"
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [LiveActivity]
      summary: Subscribe a user to a Live Activity topic
      responses:
        "201":
          description: Live Activity topic subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityUserTopicSubscription"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/channels/{activityID}:
    parameters:
      - $ref: "#/components/parameters/ActivityID"
    put:
      tags: [LiveActivity]
      summary: Provision an APNs Live Activity broadcast channel
      description: |
        Explicitly ensures one no-storage APNs channel and binds it to the
        activityId and topicId. This uses the same PostgreSQL advisory-lock
        path as lazy topic-scoped starts. Same-activity callers wait for the
        creator and reuse its stored mapping without another APNs call;
        different activity IDs remain concurrent. Channel delivery applies to
        topic-scoped Live Activity jobs with the same topicId; user-scoped jobs
        remain token-only. Reusing the activityId for another topic, or
        provisioning for a failed, closed, or expired logical activity,
        returns 409. Empty-start completion uses the same activity lock, so
        it cannot fail a logical job while its channel is being provisioned.
        Provisioning before a logical job exists remains supported.

        The identifiers are opaque and are matched without normalization.
        APNs channel creation has no idempotency key. The lock prevents
        duplicate creates for successful, unambiguous requests, but exactly-once
        creation is not guaranteed if APNs succeeds and its response or the
        database commit result is ambiguous. Provider, lock, and persistence
        failures are returned to the caller; unlike lazy start, this endpoint
        does not fall back to token-only behavior. If APNs fails, queued
        same-activity callers retry serially because no mapping winner exists;
        each attempt holds a database transaction and connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionLiveActivityChannelRequest"
      responses:
        "200":
          description: |
            The matching channel mapping already existed, or this caller
            waited for and reused a concurrent creator's mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityChannel"
        "201":
          description: This caller created and stored the channel mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityChannel"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "502":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"
    get:
      tags: [LiveActivity]
      summary: Get the broadcast channel mapped to an activity
      responses:
        "200":
          description: Channel mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityChannel"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [LiveActivity]
      summary: Delete an activity's APNs broadcast channel
      description: |
        Deletes the channel at APNs and removes its local mapping. Clients
        subscribed to that channel stop receiving channel broadcasts.
      responses:
        "204":
          description: Channel and mapping deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "502":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/jobs:
    post:
      tags: [LiveActivity]
      summary: Start, update, or end a Live Activity
      description: |
        The request and response shapes are unchanged by broadcast channels.
        Before creating a topic-scoped start job, Pushboy lazily ensures the
        activityId-to-topicId channel mapping through the same locked operation
        as the channel PUT endpoint. Channel provider, lock, and persistence
        failures are logged and the start continues token-only. A mapping to a
        different topic, or an existing job for another user, topic, or activity
        type, returns 409 before APNs channel creation. User-scoped starts
        never create channels. A repeated start for the same active activity
        returns already_started. Reusing a failed, closed, or expired activityId
        returns 409; retry with a new activityId.
        Concurrent same-activity failures retry APNs serially while holding a
        database transaction and connection; no cooldown or provisioning state
        is added.

        Updates publish to a matching channel and retain the existing direct
        APNs-token and Android FCM fanout. If channel mapping lookup fails,
        updates log the error and continue that token fanout. Ends fail before
        dispatch on a mapping lookup error so callers can retry instead of
        leaving channel activities open. A missing mapping is normal token-only
        behavior for both actions.

        Dispatch is asynchronous. A token-only start with no eligible
        recipients marks both its dispatch and job FAILED and releases the
        active scope. After registering an eligible token, start again with a
        new activityId. A matching channel-backed job remains active when
        there are no remote-start targets, because clients may have started
        activities manually on that channel; its empty start dispatch completes.
        A broadcast update or end counts one channel request, not one request
        per subscribed device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveActivityJobRequest"
            examples:
              start:
                value:
                  action: start
                  activityId: order-123
                  activityType: OrderDeliveryActivity
                  userId: user-123
                  payload:
                    status: driver_assigned
                    etaMinutes: 18
                  options:
                    alert:
                      title: Order update
                      body: Your driver is on the way.
                    attributesType: OrderDeliveryAttributes
                    attributes:
                      orderId: order-123
                    priority: high
              update:
                value:
                  action: update
                  activityId: order-123
                  payload:
                    status: arriving
                    etaMinutes: 3
                  options:
                    collapse_id: order-123
      responses:
        "200":
          description: Existing Live Activity was already started or closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityJobResponse"
        "202":
          description: Live Activity dispatch queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityJobResponse"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          description: |
            The activityId already has a channel mapping or start job for
            another topic or user scope or activity type, or the activityId
            belongs to a failed, closed, or expired activity.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

components:
  securitySchemes:
    TenantServerKey:
      type: http
      scheme: bearer
      description: Tenant server key for trusted backends only.
  parameters:
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
      example: user-123
    TokenID:
      name: tokenID
      in: path
      required: true
      schema:
        type: string
      example: 018f7b7a-a9b7-7a22-9d6f-6fb3c9b6b9c0
    TopicID:
      name: topicID
      in: path
      required: true
      schema:
        type: string
      example: broadcast
    JobID:
      name: jobID
      in: path
      required: true
      schema:
        type: string
      example: 018f7b7a-a9b7-7a22-9d6f-6fb3c9b6b9c0
    ActivityID:
      name: activityID
      in: path
      required: true
      description: Opaque product activity identifier; matching is exact.
      schema:
        type: string
      example: order-123
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque URL-safe cursor returned by the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50 and must be between 1 and 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    NotificationStatus:
      name: status
      in: query
      required: false
      description: Exact uppercase notification job status. Omit for no status filter.
      schema:
        type: string
        enum: [QUEUED, SCHEDULED, IN_PROGRESS, DISPATCHED, COMPLETED, FAILED]

  responses:
    TenantUnauthorized:
      description: Missing, malformed, invalid, expired, or revoked bearer key, or disabled tenant.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
    TenantForbidden:
      description: The bearer key lacks the required scope.
    TenantResourceNotFound:
      description: The resource does not exist in the authenticated tenant.
    TextError:
      description: Plain text error response.
      content:
        text/plain:
          schema:
            type: string
            example: Bad request

  schemas:
    TenantUser:
      type: object
      additionalProperties: false
      required: [uid, kind]
      properties:
        uid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [anonymous, identified]
    TenantTopic:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Platform:
      type: string
      enum: [apns, fcm]

    CreateUserRequest:
      type: object
      properties:
        id:
          type: string
          description: Optional caller-provided user id. A UUID is generated when omitted.
          example: user-123

    RegisterTokenRequest:
      type: object
      required: [platform, token]
      properties:
        id:
          type: string
          description: Optional user id. A UUID is generated when omitted.
          example: user-123
        platform:
          $ref: "#/components/schemas/Platform"
        token:
          type: string
          example: device-token

    CreateTopicRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: broadcast
        name:
          type: string
          example: Broadcast

    NotificationPayload:
      type: object
      properties:
        title:
          type: string
          example: New message
        body:
          type: string
          example: You have a new message.
        image_url:
          type: string
          format: uri
        sound:
          type: string
          example: default
        badge:
          oneOf:
            - type: integer
            - type: "null"
          example: 1
        data:
          type: object
          additionalProperties:
            type: string
          example:
            conversationId: c_123
        silent:
          type: boolean
          default: false
        collapse_id:
          type: string
          example: conversation-c_123
        priority:
          type: string
          enum: [high, normal]
        ttl:
          type: integer
          minimum: 0
          description: Seconds until expiration.
        thread_id:
          type: string
        category:
          type: string

    SendNotificationRequest:
      allOf:
        - $ref: "#/components/schemas/NotificationPayload"
        - type: object
          properties:
            scheduled_at:
              type: string
              format: date-time
              description: Optional future RFC3339 timestamp.
        - anyOf:
            - required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
            - required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
            - required: [silent]
              properties:
                silent:
                  const: true

    QueuedJobResponse:
      type: object
      required: [status, job_id]
      properties:
        status:
          type: string
          example: queued
        job_id:
          type: string
          example: 018f7b7a-a9b7-7a22-9d6f-6fb3c9b6b9c0

    User:
      type: object
      required: [ID, CreatedAt]
      properties:
        ID:
          type: string
          example: user-123
        CreatedAt:
          type: string
          example: "2026-05-01T10:30:00Z"

    PaginatedUsers:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          example: ""
        has_more:
          type: boolean
          example: false

    Token:
      type: object
      required: [ID, UserID, Platform, Token, CreatedAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        Platform:
          $ref: "#/components/schemas/Platform"
        Token:
          type: string
        CreatedAt:
          type: string

    Topic:
      type: object
      required: [ID, Name]
      properties:
        ID:
          type: string
          example: broadcast
        Name:
          type: string
          example: Broadcast

    UserTopicSubscription:
      type: object
      required: [ID, UserID, TopicID, CreatedAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        TopicID:
          type: string
        CreatedAt:
          type: string

    TopicSubscriber:
      type: object
      required: [ID, CreatedAt, SubscribedAt]
      properties:
        ID:
          type: string
          example: user-123
        CreatedAt:
          type: string
          example: "2026-05-01T10:00:00Z"
        SubscribedAt:
          type: string
          example: "2026-05-01T10:30:00Z"

    PaginatedTopicSubscribers:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopicSubscriber"
        next_cursor:
          type: string
          example: ""
        has_more:
          type: boolean
          example: false

    PublishJob:
      type: object
      required: [ID, Status, TotalCount, SuccessCount, FailureCount, CreatedAt]
      properties:
        ID:
          type: string
        TopicID:
          type: string
        UserID:
          type: string
        Payload:
          $ref: "#/components/schemas/NotificationPayload"
        Status:
          type: string
          enum: [QUEUED, SCHEDULED, IN_PROGRESS, DISPATCHED, COMPLETED, FAILED]
        TotalCount:
          type: integer
        SuccessCount:
          type: integer
        FailureCount:
          type: integer
        CreatedAt:
          type: string
        CompletedAt:
          type: string
        ScheduledAt:
          type: string

    PaginatedPublishJobs:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublishJob"
        next_cursor:
          type: string
          example: ""
        has_more:
          type: boolean
          example: false

    LiveActivityTokenType:
      type: string
      enum: [start, update]

    LiveActivityAction:
      type: string
      enum: [start, update, end]

    RegisterLiveActivityTokenRequest:
      type: object
      required: [userId, platform, tokenType, token]
      properties:
        userId:
          type: string
          example: user-123
        topicId:
          type: string
          example: live-orders
        activityId:
          type: string
          description: Associates this token with a specific Live Activity for scoped update/end fanout.
          example: order-123
        platform:
          $ref: "#/components/schemas/Platform"
        tokenType:
          $ref: "#/components/schemas/LiveActivityTokenType"
        token:
          type: string
          example: live-activity-token
        expiresAt:
          type: string
          format: date-time
        supportsBroadcastChannels:
          type: boolean
          default: false
          description: |
            Set true only when this APNs push-to-start token belongs to an
            iOS/iPadOS 18+ app build that implements and enables broadcast
            channels and has the Apple capability provisioned. Runtime OS
            availability alone is insufficient. The server rejects true for
            APNs update tokens and all FCM tokens.

    DeleteLiveActivityTokenRequest:
      type: object
      required: [userId, token]
      properties:
        userId:
          type: string
        token:
          type: string

    ProvisionLiveActivityChannelRequest:
      type: object
      required: [topicId]
      properties:
        topicId:
          type: string
          description: Opaque topic identifier; matching is exact.
          example: live-orders

    LiveActivityChannel:
      type: object
      required: [activityId, topicId, channelId, createdAt]
      properties:
        activityId:
          type: string
          description: Opaque product activity identifier; matching is exact.
          example: order-123
        topicId:
          type: string
          description: Opaque topic identifier; matching is exact.
          example: live-orders
        channelId:
          type: string
          description: Opaque channel identifier returned by APNs.
        createdAt:
          type: string
          format: date-time

    LiveActivityOptions:
      type: object
      additionalProperties: true
      properties:
        alert:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
            sound:
              type: string
        attributesType:
          type: string
        attributes:
          type: object
          additionalProperties: true
        timestamp:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        staleDate:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        dismissalDate:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        expiration:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        priority:
          oneOf:
            - type: string
              enum: [high, normal, "5", "10"]
            - type: integer
              enum: [5, 10]
        ttl:
          type: integer
          minimum: 0
        collapse_id:
          type: string
        relevanceScore:
          type: number

    CreateLiveActivityJobRequest:
      oneOf:
        - $ref: "#/components/schemas/LiveActivityStartJobRequest"
        - $ref: "#/components/schemas/LiveActivityUpdateJobRequest"
        - $ref: "#/components/schemas/LiveActivityEndJobRequest"

    LiveActivityJobTarget:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/LiveActivityAction"
        activityId:
          type: string
          description: Opaque product activity identifier; matching is exact.
        activityType:
          type: string
        userId:
          type: string
        topicId:
          type: string
        payload:
          type: object
          additionalProperties: true
        options:
          $ref: "#/components/schemas/LiveActivityOptions"
        expiresAt:
          type: string
          format: date-time

    LiveActivityUserScope:
      type: object
      properties:
        userId:
          type: string
        topicId:
          type: string
      required: [userId]
      not:
        required: [topicId]

    LiveActivityTopicScope:
      type: object
      properties:
        userId:
          type: string
        topicId:
          type: string
      required: [topicId]
      not:
        required: [userId]

    LiveActivityActivityIdScope:
      type: object
      properties:
        activityId:
          type: string
        userId:
          type: string
        topicId:
          type: string
      required: [activityId]
      not:
        anyOf:
          - required: [userId]
          - required: [topicId]

    LiveActivityScopedLookup:
      type: object
      properties:
        activityId:
          type: string
        activityType:
          type: string
      required: [activityType]
      oneOf:
        - $ref: "#/components/schemas/LiveActivityUserScope"
        - $ref: "#/components/schemas/LiveActivityTopicScope"
      not:
        required: [activityId]

    LiveActivityStartJobRequest:
      allOf:
        - $ref: "#/components/schemas/LiveActivityJobTarget"
        - type: object
          required: [action, activityId, activityType, payload]
          properties:
            action:
              const: start
            payload:
              type: object
              additionalProperties: true
        - oneOf:
            - $ref: "#/components/schemas/LiveActivityUserScope"
            - $ref: "#/components/schemas/LiveActivityTopicScope"

    LiveActivityUpdateJobRequest:
      allOf:
        - $ref: "#/components/schemas/LiveActivityJobTarget"
        - type: object
          required: [action, payload]
          properties:
            action:
              const: update
            payload:
              type: object
              additionalProperties: true
        - oneOf:
            - $ref: "#/components/schemas/LiveActivityActivityIdScope"
            - $ref: "#/components/schemas/LiveActivityScopedLookup"

    LiveActivityEndJobRequest:
      allOf:
        - $ref: "#/components/schemas/LiveActivityJobTarget"
        - type: object
          required: [action]
          properties:
            action:
              const: end
        - oneOf:
            - $ref: "#/components/schemas/LiveActivityActivityIdScope"
            - $ref: "#/components/schemas/LiveActivityScopedLookup"

    LiveActivityJobResponse:
      type: object
      required: [activityId, status]
      properties:
        activityId:
          type: string
        status:
          type: string
          enum: [started, updated, ended, already_started, closed]
        dispatchId:
          type: string

    LiveActivityToken:
      type: object
      required: [ID, UserID, Platform, TokenType, Token, supportsBroadcastChannels, CreatedAt, LastSeenAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        Platform:
          $ref: "#/components/schemas/Platform"
        TokenType:
          $ref: "#/components/schemas/LiveActivityTokenType"
        Token:
          type: string
        supportsBroadcastChannels:
          type: boolean
          description: |
            Whether this APNs push-to-start token's client can subscribe the
            resulting Live Activity to an APNs broadcast channel.
        CreatedAt:
          type: string
        LastSeenAt:
          type: string
        ExpiresAt:
          type: string
        InvalidatedAt:
          type: string

    LiveActivityUserTopicSubscription:
      type: object
      required: [ID, UserID, TopicID, CreatedAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        TopicID:
          type: string
        CreatedAt:
          type: string
