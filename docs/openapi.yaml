openapi: 3.1.0
info:
  title: Pushboy API
  version: 0.1.0
  summary: Self-hosted APNS, FCM, and Live Activity delivery API.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
  description: |
    Pushboy exposes a small HTTP API for users, device tokens, topics,
    notification jobs, and Live Activity dispatches. The /v2 key, user, device, topic,
    and provider routes authenticate tenant server keys. The legacy /v1 routes remain
    unauthenticated and globally scoped. Deploy behind a trusted backend or private network.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: ServerKeys
  - name: ProviderConfigs
  - name: Health
  - name: Users
  - name: Devices
  - name: Tokens
  - name: Topics
  - name: Subscriptions
  - name: Notifications
  - name: LiveActivity
security: []
paths:
  /v2/keys:
    post:
      tags: [ServerKeys]
      summary: Issue a server key for the authenticated app tenant
      description: |
        Requires keys:manage. The bearer key determines the tenant and bounds
        the new key's scopes and expiry. Existing keys stay active until expiry
        or revocation.
      security:
        - TenantServerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes]
              properties:
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum: [read, send, "users:write", "devices:write", "topics:write", "keys:manage", "providers:manage"]
                expiresAt:
                  type: [string, "null"]
                  format: date-time
                  description: Future expiry at or before the issuer's expiry. Omit or pass null for an unbounded key only if the issuer has no expiry.
      responses:
        "201":
          description: Key issued.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, key]
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                    description: Secret shown only in this response.
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          description: Missing, malformed, invalid, expired, or revoked bearer key, or disabled tenant.
        "403":
          description: Missing keys:manage or the requested scopes or expiry exceed the issuer's authority.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/keys/{keyId}:
    delete:
      tags: [ServerKeys]
      summary: Revoke a server key within the authenticated tenant
      description: |
        Requires keys:manage. Revocation takes effect on subsequent authentication.
      security:
        - TenantServerKey: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Key revoked or already revoked.
        "401":
          description: Missing or invalid bearer key, or inactive key or tenant.
        "403":
          description: Missing keys:manage.
        "404":
          description: Key does not exist within the authenticated tenant.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/providers:
    post:
      tags: [ProviderConfigs]
      summary: Create a provider route for the authenticated tenant
      description: |
        Requires providers:manage. The APNs bundle or FCM target project and environment define the route.
        APNs compares bundle IDs without regard to case and preserves the submitted spelling.
        A duplicate namespace returns 409. Use the route ID to rotate credentials.
      security:
        - TenantServerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, environment, applicationId, credentials]
              properties:
                provider:
                  type: string
                  enum: [apns, fcm]
                environment:
                  type: string
                  description: APNs supports sandbox and production. FCM supports production.
                  enum: [sandbox, production]
                applicationId:
                  type: string
                  description: APNs bundle ID or Firebase target project ID.
                enabled:
                  type: [boolean, "null"]
                  default: true
                credentials:
                  $ref: "#/components/schemas/ProviderCredentials"
      responses:
        "201":
          description: Provider route created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProvider"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "409":
          description: A provider route already exists for this namespace in the tenant.
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          description: The active encryption key is unavailable.
    get:
      tags: [ProviderConfigs]
      summary: List provider routes and their local readiness
      description: Requires read. Routes are scoped to the bearer key's tenant.
      security:
        - TenantServerKey: []
      responses:
        "200":
          description: Provider routes and redacted readiness. An unready route does not affect the status of this response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantProvider"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "500":
          $ref: "#/components/responses/TextError"

  /v2/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [ProviderConfigs]
      summary: Read a tenant provider route and its local readiness
      description: Requires read.
      security:
        - TenantServerKey: []
      responses:
        "200":
          description: Provider route metadata and redacted readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProvider"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "500":
          $ref: "#/components/responses/TextError"
    put:
      tags: [ProviderConfigs]
      summary: Rotate credentials or disable a tenant provider route
      description: |
        Requires providers:manage. Include the current credential version.
        A successful rotation increments that version and retains the route ID and namespace.
        Omit enabled or use null during rotation to preserve the route's current enabled state.
        Send enabled false with no credentials to disable the route at its current version.
        Re-enabling a route requires a credential upload with enabled true.
      security:
        - TenantServerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credentialVersion]
              anyOf:
                - required: [credentials]
                - required: [enabled]
                  properties:
                    enabled:
                      const: false
              properties:
                credentialVersion:
                  type: integer
                  format: int64
                  minimum: 1
                enabled:
                  type: [boolean, "null"]
                credentials:
                  $ref: "#/components/schemas/ProviderCredentials"
      responses:
        "200":
          description: Provider route updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProvider"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "409":
          description: The supplied credential version no longer matches the route.
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          description: The active encryption key is unavailable.

  /v2/users:
    post:
      operationId: createTenantUser
      tags: [Users]
      summary: Create a user in the authenticated app tenant
      description: |
        Requires users:write. Omit identity or set it to null to create an
        anonymous user. A supplied identity creates an identified user.
        Pushboy generates the canonical UID. A repeated top-level `identity` property,
        invalid UTF-8, and unpaired surrogate escapes return 400.
      security:
        - TenantServerKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: |
            A single hyphenated UUID for retrying this create request. In the
            same tenant, retrying with this key and the same identity returns
            the original user. An omitted or null identity counts as anonymous.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                identity:
                  type: [object, "null"]
                  additionalProperties: false
                  required: [namespace, externalId]
                  properties:
                    namespace:
                      type: string
                      minLength: 1
                      maxLength: 128
                      description: Exact identity namespace. The legacy namespace is reserved in all capitalizations.
                    externalId:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: Exact external account identifier in this namespace.
            examples:
              anonymous:
                value: {}
              identified:
                value:
                  identity:
                    namespace: accounts
                    externalId: account-42
      responses:
        "201":
          description: User created or returned from the original request with this idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "409":
          description: The identity already belongs to a user in this tenant, or this idempotency key was used with a different identity.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/users/{uid}:
    get:
      operationId: getTenantUser
      tags: [Users]
      summary: Get a user by canonical UID
      description: Requires read. Returns the user within the authenticated tenant.
      security:
        - TenantServerKey: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User in the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "500":
          $ref: "#/components/responses/TextError"

  /v2/devices/{installationUUID}:
    put:
      operationId: enrollInstallation
      tags: [Devices]
      summary: Enroll an installation or refresh its observations
      description: |
        Requires devices:write on a trusted backend key. Generate a random UUID
        per app installation and reuse it for each refresh. First enrollment
        creates an anonymous Pushboy user. Every refresh returns the current
        association and preserves omitted observations. An empty JSON object
        records a heartbeat. Location changes only when the reported observation
        is newer.
      security:
        - TenantServerKey: []
      parameters:
        - name: installationUUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                os:
                  type: string
                  minLength: 1
                  maxLength: 64
                osVersion:
                  type: string
                  minLength: 1
                  maxLength: 64
                appVersion:
                  type: string
                  minLength: 1
                  maxLength: 64
                locale:
                  type: string
                  minLength: 1
                  maxLength: 64
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 128
                notificationPermission:
                  type: string
                  enum: [notDetermined, denied, authorized, provisional, ephemeral]
                location:
                  type: object
                  additionalProperties: false
                  required: [latitude, longitude, source, observedAt]
                  properties:
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                    source:
                      type: string
                      minLength: 1
                      maxLength: 64
                    observedAt:
                      type: string
                      format: date-time
                      description: The server rejects observations more than five minutes ahead of its clock.
      responses:
        "200":
          description: Current installation association after refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInstallation"
        "201":
          description: Installation created and associated with a new anonymous user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInstallation"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "410":
          description: This tenant's installation has been retired.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/TextError"

  /v2/topics:
    post:
      operationId: createTenantTopic
      tags: [Topics]
      summary: Create a topic in the authenticated app tenant
      description: |
        Requires topics:write. Topic IDs and names match exactly and are unique
        within the tenant. Invalid UTF-8 and unpaired surrogate escapes return 400.
      security:
        - TenantServerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  not:
                    enum: [".", ".."]
                  example: releases
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Release notes
      responses:
        "201":
          description: Topic created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTopic"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "409":
          description: The topic ID or name already exists in this tenant.
        "500":
          $ref: "#/components/responses/TextError"

  /v2/topics/{topicId}:
    get:
      operationId: getTenantTopic
      tags: [Topics]
      summary: Get a topic by ID
      description: Requires read. Returns the topic within the authenticated tenant.
      security:
        - TenantServerKey: []
      parameters:
        - name: topicId
          in: path
          required: true
          description: Exact topic ID, percent-encoded as a path segment.
          schema:
            type: string
      responses:
        "200":
          description: Topic in the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTopic"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "500":
          $ref: "#/components/responses/TextError"

  /v2/devices/{installationUUID}/identify:
    post:
      operationId: identifyInstallation
      tags: [Devices]
      summary: Identify the owner of one installation
      description: |
        Requires both devices:write and users:write on a trusted backend key
        and an enrolled installation.
        Choose an existing identified account by UID or supply a verified identity.
        A new identity promotes the current anonymous owner or creates a separate
        account when the current owner is identified. An existing identity
        switches only this installation to its account. Device observations
        stay with the installation.
      security:
        - TenantServerKey: []
      parameters:
        - $ref: "#/components/parameters/InstallationUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, expectedOwnershipVersion]
              oneOf:
                - required: [uid]
                - required: [identity]
              properties:
                operationId:
                  type: string
                  format: uuid
                expectedOwnershipVersion:
                  type: integer
                  format: int64
                  minimum: 1
                uid:
                  type: string
                  format: uuid
                identity:
                  type: object
                  additionalProperties: false
                  required: [namespace, externalId]
                  properties:
                    namespace:
                      type: string
                      minLength: 1
                      maxLength: 128
                    externalId:
                      type: string
                      minLength: 1
                      maxLength: 512
      responses:
        "200":
          $ref: "#/components/responses/InstallationOwnershipResult"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "409":
          $ref: "#/components/responses/InstallationOwnershipConflict"
        "410":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v2/devices/{installationUUID}/logout:
    post:
      operationId: logoutInstallation
      tags: [Devices]
      summary: Return one installation to anonymous ownership
      description: |
        Requires devices:write on a trusted backend key and an enrolled
        installation. Logout switches only
        this installation to a new anonymous user. If its owner is already
        anonymous, its association and ownership version stay the same.
      security:
        - TenantServerKey: []
      parameters:
        - $ref: "#/components/parameters/InstallationUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, expectedOwnershipVersion]
              properties:
                operationId:
                  type: string
                  format: uuid
                expectedOwnershipVersion:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/InstallationOwnershipResult"
        "400":
          $ref: "#/components/responses/TextError"
        "401":
          $ref: "#/components/responses/TenantUnauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "404":
          $ref: "#/components/responses/TenantResourceNotFound"
        "409":
          $ref: "#/components/responses/InstallationOwnershipConflict"
        "410":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/ping:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /v1/users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users ordered by creation time descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
        "400":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/:
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Users]
      summary: Get a user
      responses:
        "200":
          description: User found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        "204":
          description: User deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/tokens:
    post:
      tags: [Tokens]
      summary: Register a push token
      description: Creates the user if the provided id does not exist. Generates a user id if id is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTokenRequest"
      responses:
        "201":
          description: Token registered.
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    $ref: "#/components/schemas/Token"
        "400":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Tokens]
      summary: List a user's push tokens
      responses:
        "200":
          description: Tokens for the user. Unknown users currently return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Token"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/tokens/{tokenID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/TokenID"
    delete:
      tags: [Tokens]
      summary: Delete a push token
      description: The current handler deletes by tokenID; userID is part of the route but is not used for authorization.
      responses:
        "204":
          description: Token deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/subscriptions/{topicID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/TopicID"
    post:
      tags: [Subscriptions]
      summary: Subscribe a user to a topic
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTopicSubscription"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [Subscriptions]
      summary: Unsubscribe a user from a topic
      responses:
        "204":
          description: Subscription deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/subscriptions:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Subscriptions]
      summary: List a user's topic subscriptions
      responses:
        "200":
          description: Subscriptions for the user. Unknown users currently return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserTopicSubscription"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/notifications:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Notifications]
      summary: List notifications eligible for a user
      description: Returns direct user sends and topic sends where the user is currently subscribed and the job effective time is on or after the subscription time. This is eligibility, not delivery history.
      parameters:
        - $ref: "#/components/parameters/NotificationStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Eligible notification jobs ordered by effective time descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPublishJobs"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/users/{userID}/send:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Notifications]
      summary: Send or schedule a notification to one user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedJobResponse"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

  /v1/topics/:
    get:
      tags: [Topics]
      summary: List topics
      responses:
        "200":
          description: Topics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
        "500":
          $ref: "#/components/responses/TextError"
    post:
      tags: [Topics]
      summary: Create a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
      responses:
        "201":
          description: Topic created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/topics/{topicID}:
    parameters:
      - $ref: "#/components/parameters/TopicID"
    get:
      tags: [Topics]
      summary: Get a topic
      responses:
        "200":
          description: Topic found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/TextError"
