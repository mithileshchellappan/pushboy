              schema:
                $ref: "#/components/schemas/QueuedJobResponse"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

  /v1/notifications/{jobID}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [Notifications]
      summary: Get notification job
      responses:
        "200":
          description: Notification job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishJob"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/tokens:
    post:
      tags: [LiveActivity]
      summary: Register a Live Activity token
      description: FCM tokens are stored as update tokens. APNS update tokens are capped to the default Live Activity lifetime if no sooner expiry is provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterLiveActivityTokenRequest"
      responses:
        "201":
          description: Token registered.
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    $ref: "#/components/schemas/LiveActivityToken"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [LiveActivity]
      summary: Invalidate a Live Activity token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteLiveActivityTokenRequest"
      responses:
        "204":
          description: Token invalidated.
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/topics/{topicID}/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/TopicID"
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [LiveActivity]
      summary: Subscribe a user to a Live Activity topic
      responses:
        "201":
          description: Live Activity topic subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityUserTopicSubscription"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/channels/{activityID}:
    parameters:
      - $ref: "#/components/parameters/ActivityID"
    put:
      tags: [LiveActivity]
      summary: Provision an APNs Live Activity broadcast channel
      description: |
        Explicitly ensures one no-storage APNs channel and binds it to the
        activityId and topicId. This uses the same PostgreSQL advisory-lock
        path as lazy topic-scoped starts. Same-activity callers wait for the
        creator and reuse its stored mapping without another APNs call;
        different activity IDs remain concurrent. Channel delivery applies to
        topic-scoped Live Activity jobs with the same topicId; user-scoped jobs
        remain token-only. Reusing the activityId for another topic, or
        provisioning for a failed, closed, or expired logical activity,
        returns 409. Empty-start completion uses the same activity lock, so
        it cannot fail a logical job while its channel is being provisioned.
        Provisioning before a logical job exists remains supported.

        The identifiers are opaque and are matched without normalization.
        APNs channel creation has no idempotency key. The lock prevents
        duplicate creates for successful, unambiguous requests, but exactly-once
        creation is not guaranteed if APNs succeeds and its response or the
        database commit result is ambiguous. Provider, lock, and persistence
        failures are returned to the caller; unlike lazy start, this endpoint
        does not fall back to token-only behavior. If APNs fails, queued
        same-activity callers retry serially because no mapping winner exists;
        each attempt holds a database transaction and connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionLiveActivityChannelRequest"
      responses:
        "200":
          description: |
            The matching channel mapping already existed, or this caller
            waited for and reused a concurrent creator's mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityChannel"
        "201":
          description: This caller created and stored the channel mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityChannel"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "502":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"
    get:
      tags: [LiveActivity]
      summary: Get the broadcast channel mapped to an activity
      responses:
        "200":
          description: Channel mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityChannel"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    delete:
      tags: [LiveActivity]
      summary: Delete an activity's APNs broadcast channel
      description: |
        Deletes the channel at APNs and removes its local mapping. Clients
        subscribed to that channel stop receiving channel broadcasts.
      responses:
        "204":
          description: Channel and mapping deleted.
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "502":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

  /v1/live-activity/jobs:
    post:
      tags: [LiveActivity]
      summary: Start, update, or end a Live Activity
      description: |
        The request and response shapes are unchanged by broadcast channels.
        Before creating a topic-scoped start job, Pushboy lazily ensures the
        activityId-to-topicId channel mapping through the same locked operation
        as the channel PUT endpoint. Channel provider, lock, and persistence
        failures are logged and the start continues token-only. A mapping to a
        different topic, or an existing job for another user, topic, or activity
        type, returns 409 before APNs channel creation. User-scoped starts
        never create channels. A repeated start for the same active activity
        returns already_started. Reusing a failed, closed, or expired activityId
        returns 409; retry with a new activityId.
        Concurrent same-activity failures retry APNs serially while holding a
        database transaction and connection; no cooldown or provisioning state
        is added.

        Updates publish to a matching channel and retain the existing direct
        APNs-token and Android FCM fanout. If channel mapping lookup fails,
        updates log the error and continue that token fanout. Ends fail before
        dispatch on a mapping lookup error so callers can retry instead of
        leaving channel activities open. A missing mapping is normal token-only
        behavior for both actions.

        Dispatch is asynchronous. A token-only start with no eligible
        recipients marks both its dispatch and job FAILED and releases the
        active scope. After registering an eligible token, start again with a
        new activityId. A matching channel-backed job remains active when
        there are no remote-start targets, because clients may have started
        activities manually on that channel; its empty start dispatch completes.
        A broadcast update or end counts one channel request, not one request
        per subscribed device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveActivityJobRequest"
            examples:
              start:
                value:
                  action: start
                  activityId: order-123
                  activityType: OrderDeliveryActivity
                  userId: user-123
                  payload:
                    status: driver_assigned
                    etaMinutes: 18
                  options:
                    alert:
                      title: Order update
                      body: Your driver is on the way.
                    attributesType: OrderDeliveryAttributes
                    attributes:
                      orderId: order-123
                    priority: high
              update:
                value:
                  action: update
                  activityId: order-123
                  payload:
                    status: arriving
                    etaMinutes: 3
                  options:
                    collapse_id: order-123
      responses:
        "200":
          description: Existing Live Activity was already started or closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityJobResponse"
        "202":
          description: Live Activity dispatch queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityJobResponse"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          description: |
            The activityId already has a channel mapping or start job for
            another topic or user scope or activity type, or the activityId
            belongs to a failed, closed, or expired activity.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/TextError"
        "503":
          $ref: "#/components/responses/TextError"

components:
  securitySchemes:
    TenantServerKey:
      type: http
      scheme: bearer
      description: Tenant server key for trusted backends only.
  parameters:
    InstallationUUID:
      name: installationUUID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
      example: user-123
    TokenID:
      name: tokenID
      in: path
      required: true
      schema:
        type: string
      example: 018f7b7a-a9b7-7a22-9d6f-6fb3c9b6b9c0
    TopicID:
      name: topicID
      in: path
      required: true
      schema:
        type: string
      example: broadcast
    JobID:
      name: jobID
      in: path
      required: true
      schema:
        type: string
      example: 018f7b7a-a9b7-7a22-9d6f-6fb3c9b6b9c0
    ActivityID:
      name: activityID
      in: path
      required: true
      description: Opaque product activity identifier; matching is exact.
      schema:
        type: string
      example: order-123
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque URL-safe cursor returned by the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50 and must be between 1 and 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    NotificationStatus:
      name: status
      in: query
      required: false
      description: Exact uppercase notification job status. Omit for no status filter.
      schema:
        type: string
        enum: [QUEUED, SCHEDULED, IN_PROGRESS, DISPATCHED, COMPLETED, FAILED]

  responses:
    InstallationOwnershipResult:
      description: |
        Current association. The last operation can be retried with the same
        UUID and request to return the same result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TenantInstallation"
    InstallationOwnershipConflict:
      description: |
        The ownership version is stale, the operation UUID was already used
        with a different request or overtaken by another operation, or the
        requested UID is anonymous. Refresh the current association before
        sending another ownership operation.
      content:
        text/plain:
          schema:
            type: string
    TenantUnauthorized:
      description: Missing, malformed, invalid, expired, or revoked bearer key, or disabled tenant.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
    TenantForbidden:
      description: The bearer key lacks the required scope.
    TenantResourceNotFound:
      description: The resource does not exist in the authenticated tenant.
    TextError:
      description: Plain text error response.
      content:
        text/plain:
          schema:
            type: string
            example: Bad request

  schemas:
    ProviderCredentials:
      description: Use the credential format for the route's provider.
      oneOf:
        - title: APNs signing key
          type: object
          required: [keyId, teamId, privateKey]
          properties:
            keyId:
              type: string
              pattern: '^[A-Z0-9]{10}$'
            teamId:
              type: string
              pattern: '^[A-Z0-9]{10}$'
            privateKey:
              type: string
              description: PEM-encoded P-256 signing key.
              writeOnly: true
        - title: Firebase service account
          type: object
          required: [type, project_id, private_key_id, private_key, client_email, token_uri]
          properties:
            type:
              const: service_account
            project_id:
              type: string
              description: The service account's sender project. For a different target, grant the account access in the target project's IAM.
            private_key_id:
              type: string
            private_key:
              type: string
              description: PEM-encoded RSA signing key with at least 2048 bits.
              writeOnly: true
            client_email:
              type: string
              format: email
            token_uri:
              const: https://oauth2.googleapis.com/token
            universe_domain:
              type: string
              enum: ["", googleapis.com]
    TenantProvider:
      type: object
      additionalProperties: false
      required: [id, provider, environment, applicationId, enabled, credentialVersion, createdAt, updatedAt, ready]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [apns, fcm]
        environment:
          type: string
          enum: [sandbox, production]
        applicationId:
          type: string
        enabled:
          type: boolean
        credentialVersion:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ready:
          type: boolean
          description: The enabled route passed local credential checks. Provider acceptance has not been checked.
        readinessReason:
          type: string
          enum: [disabled, encryption_key_unavailable, credential_unreadable, credential_invalid]
    TenantUser:
      type: object
      additionalProperties: false
      required: [uid, kind]
      properties:
        uid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [anonymous, identified]
    TenantInstallation:
      type: object
      additionalProperties: false
      required: [id, uid, ownershipVersion]
      properties:
        id:
          type: string
          format: uuid
        uid:
          type: string
          format: uuid
        ownershipVersion:
          type: integer
          format: int64
          minimum: 1
    TenantTopic:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Platform:
      type: string
      enum: [apns, fcm]

    CreateUserRequest:
      type: object
      properties:
        id:
          type: string
          description: Optional caller-provided user id. A UUID is generated when omitted.
          example: user-123

    RegisterTokenRequest:
      type: object
      required: [platform, token]
      properties:
        id:
          type: string
          description: Optional user id. A UUID is generated when omitted.
          example: user-123
        platform:
          $ref: "#/components/schemas/Platform"
        token:
          type: string
          example: device-token

    CreateTopicRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: broadcast
        name:
          type: string
          example: Broadcast

    NotificationPayload:
      type: object
      properties:
        title:
          type: string
          example: New message
        body:
          type: string
          example: You have a new message.
        image_url:
          type: string
          format: uri
        sound:
          type: string
          example: default
        badge:
          oneOf:
            - type: integer
            - type: "null"
          example: 1
        data:
          type: object
          additionalProperties:
            type: string
          example:
            conversationId: c_123
        silent:
          type: boolean
          default: false
        collapse_id:
          type: string
          example: conversation-c_123
        priority:
          type: string
          enum: [high, normal]
        ttl:
          type: integer
          minimum: 0
          description: Seconds until expiration.
        thread_id:
          type: string
        category:
          type: string

    SendNotificationRequest:
      allOf:
        - $ref: "#/components/schemas/NotificationPayload"
        - type: object
          properties:
            scheduled_at:
              type: string
              format: date-time
              description: Optional future RFC3339 timestamp.
        - anyOf:
            - required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
            - required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
            - required: [silent]
              properties:
                silent:
                  const: true

    QueuedJobResponse:
      type: object
      required: [status, job_id]
      properties:
        status:
          type: string
          example: queued
        job_id:
          type: string
          example: 018f7b7a-a9b7-7a22-9d6f-6fb3c9b6b9c0

    User:
      type: object
      required: [ID, CreatedAt]
      properties:
        ID:
          type: string
          example: user-123
        CreatedAt:
          type: string
          example: "2026-05-01T10:30:00Z"

    PaginatedUsers:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          example: ""
        has_more:
          type: boolean
          example: false

    Token:
      type: object
      required: [ID, UserID, Platform, Token, CreatedAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        Platform:
          $ref: "#/components/schemas/Platform"
        Token:
          type: string
        CreatedAt:
          type: string

    Topic:
      type: object
      required: [ID, Name]
      properties:
        ID:
          type: string
          example: broadcast
        Name:
          type: string
          example: Broadcast

    UserTopicSubscription:
      type: object
      required: [ID, UserID, TopicID, CreatedAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        TopicID:
          type: string
        CreatedAt:
          type: string

    TopicSubscriber:
      type: object
      required: [ID, CreatedAt, SubscribedAt]
      properties:
        ID:
          type: string
          example: user-123
        CreatedAt:
          type: string
          example: "2026-05-01T10:00:00Z"
        SubscribedAt:
          type: string
          example: "2026-05-01T10:30:00Z"

    PaginatedTopicSubscribers:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopicSubscriber"
        next_cursor:
          type: string
          example: ""
        has_more:
          type: boolean
          example: false

    PublishJob:
      type: object
      required: [ID, Status, TotalCount, SuccessCount, FailureCount, CreatedAt]
      properties:
        ID:
          type: string
        TopicID:
          type: string
        UserID:
          type: string
        Payload:
          $ref: "#/components/schemas/NotificationPayload"
        Status:
          type: string
          enum: [QUEUED, SCHEDULED, IN_PROGRESS, DISPATCHED, COMPLETED, FAILED]
        TotalCount:
          type: integer
        SuccessCount:
          type: integer
        FailureCount:
          type: integer
        CreatedAt:
          type: string
        CompletedAt:
          type: string
        ScheduledAt:
          type: string

    PaginatedPublishJobs:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublishJob"
        next_cursor:
          type: string
          example: ""
        has_more:
          type: boolean
          example: false

    LiveActivityTokenType:
      type: string
      enum: [start, update]

    LiveActivityAction:
      type: string
      enum: [start, update, end]

    RegisterLiveActivityTokenRequest:
      type: object
      required: [userId, platform, tokenType, token]
      properties:
        userId:
          type: string
          example: user-123
        topicId:
          type: string
          example: live-orders
        activityId:
          type: string
          description: Associates this token with a specific Live Activity for scoped update/end fanout.
          example: order-123
        platform:
          $ref: "#/components/schemas/Platform"
        tokenType:
          $ref: "#/components/schemas/LiveActivityTokenType"
        token:
          type: string
          example: live-activity-token
        expiresAt:
          type: string
          format: date-time
        supportsBroadcastChannels:
          type: boolean
          default: false
          description: |
            Set true only when this APNs push-to-start token belongs to an
            iOS/iPadOS 18+ app build that implements and enables broadcast
            channels and has the Apple capability provisioned. Runtime OS
            availability alone is insufficient. The server rejects true for
            APNs update tokens and all FCM tokens.

    DeleteLiveActivityTokenRequest:
      type: object
      required: [userId, token]
      properties:
        userId:
          type: string
        token:
          type: string

    ProvisionLiveActivityChannelRequest:
      type: object
      required: [topicId]
      properties:
        topicId:
          type: string
          description: Opaque topic identifier; matching is exact.
          example: live-orders

    LiveActivityChannel:
      type: object
      required: [activityId, topicId, channelId, createdAt]
      properties:
        activityId:
          type: string
          description: Opaque product activity identifier; matching is exact.
          example: order-123
        topicId:
          type: string
          description: Opaque topic identifier; matching is exact.
          example: live-orders
        channelId:
          type: string
          description: Opaque channel identifier returned by APNs.
        createdAt:
          type: string
          format: date-time

    LiveActivityOptions:
      type: object
      additionalProperties: true
      properties:
        alert:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
            sound:
              type: string
        attributesType:
          type: string
        attributes:
          type: object
          additionalProperties: true
        timestamp:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        staleDate:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        dismissalDate:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        expiration:
          oneOf:
            - type: string
              format: date-time
            - type: integer
        priority:
          oneOf:
            - type: string
              enum: [high, normal, "5", "10"]
            - type: integer
              enum: [5, 10]
        ttl:
          type: integer
          minimum: 0
        collapse_id:
          type: string
        relevanceScore:
          type: number

    CreateLiveActivityJobRequest:
      oneOf:
        - $ref: "#/components/schemas/LiveActivityStartJobRequest"
        - $ref: "#/components/schemas/LiveActivityUpdateJobRequest"
        - $ref: "#/components/schemas/LiveActivityEndJobRequest"

    LiveActivityJobTarget:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/LiveActivityAction"
        activityId:
          type: string
          description: Opaque product activity identifier; matching is exact.
        activityType:
          type: string
        userId:
          type: string
        topicId:
          type: string
        payload:
          type: object
          additionalProperties: true
        options:
          $ref: "#/components/schemas/LiveActivityOptions"
        expiresAt:
          type: string
          format: date-time

    LiveActivityUserScope:
      type: object
      properties:
        userId:
          type: string
        topicId:
          type: string
      required: [userId]
      not:
        required: [topicId]

    LiveActivityTopicScope:
      type: object
      properties:
        userId:
          type: string
        topicId:
          type: string
      required: [topicId]
      not:
        required: [userId]

    LiveActivityActivityIdScope:
      type: object
      properties:
        activityId:
          type: string
        userId:
          type: string
        topicId:
          type: string
      required: [activityId]
      not:
        anyOf:
          - required: [userId]
          - required: [topicId]

    LiveActivityScopedLookup:
      type: object
      properties:
        activityId:
          type: string
        activityType:
          type: string
      required: [activityType]
      oneOf:
        - $ref: "#/components/schemas/LiveActivityUserScope"
        - $ref: "#/components/schemas/LiveActivityTopicScope"
      not:
        required: [activityId]

    LiveActivityStartJobRequest:
      allOf:
        - $ref: "#/components/schemas/LiveActivityJobTarget"
        - type: object
          required: [action, activityId, activityType, payload]
          properties:
            action:
              const: start
            payload:
              type: object
              additionalProperties: true
        - oneOf:
            - $ref: "#/components/schemas/LiveActivityUserScope"
            - $ref: "#/components/schemas/LiveActivityTopicScope"

    LiveActivityUpdateJobRequest:
      allOf:
        - $ref: "#/components/schemas/LiveActivityJobTarget"
        - type: object
          required: [action, payload]
          properties:
            action:
              const: update
            payload:
              type: object
              additionalProperties: true
        - oneOf:
            - $ref: "#/components/schemas/LiveActivityActivityIdScope"
            - $ref: "#/components/schemas/LiveActivityScopedLookup"

    LiveActivityEndJobRequest:
      allOf:
        - $ref: "#/components/schemas/LiveActivityJobTarget"
        - type: object
          required: [action]
          properties:
            action:
              const: end
        - oneOf:
            - $ref: "#/components/schemas/LiveActivityActivityIdScope"
            - $ref: "#/components/schemas/LiveActivityScopedLookup"

    LiveActivityJobResponse:
      type: object
      required: [activityId, status]
      properties:
        activityId:
          type: string
        status:
          type: string
          enum: [started, updated, ended, already_started, closed]
        dispatchId:
          type: string

    LiveActivityToken:
      type: object
      required: [ID, UserID, Platform, TokenType, Token, supportsBroadcastChannels, CreatedAt, LastSeenAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        Platform:
          $ref: "#/components/schemas/Platform"
        TokenType:
          $ref: "#/components/schemas/LiveActivityTokenType"
        Token:
          type: string
        supportsBroadcastChannels:
          type: boolean
          description: |
            Whether this APNs push-to-start token's client can subscribe the
            resulting Live Activity to an APNs broadcast channel.
        CreatedAt:
          type: string
        LastSeenAt:
          type: string
        ExpiresAt:
          type: string
        InvalidatedAt:
          type: string

    LiveActivityUserTopicSubscription:
      type: object
      required: [ID, UserID, TopicID, CreatedAt]
      properties:
        ID:
          type: string
        UserID:
          type: string
        TopicID:
          type: string
        CreatedAt:
          type: string
