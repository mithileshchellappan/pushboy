name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "The release tag must point to a commit on $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and verify release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/build-release.sh "$VERSION" dist
          (cd dist && sha256sum -c SHA256SUMS)
          stage="$(mktemp -d)"
          tar -xzf "dist/pushboy_${VERSION}_linux_amd64.tar.gz" -C "$stage"
          test "$("$stage/pushboy" --version)" = "pushboy $VERSION ($(git rev-parse HEAD))"
          diff -r db/migrations/postgres "$stage/db/migrations/postgres"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Publish versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh
