name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pushboy_test
          POSTGRES_PASSWORD: pushboy_test
          POSTGRES_DB: pushboy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pushboy_test -d pushboy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PUSHBOY_TEST_DATABASE_URL: postgres://pushboy_test:pushboy_test@127.0.0.1:5432/pushboy_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Test and race test including required PostgreSQL integration
        shell: bash
        run: |
          run_go_tests() {
            local results="$RUNNER_TEMP/go-test.json"
            go test -json -count=1 "$@" ./... | tee "$results" | jq -j '.Output // empty'
            if ! jq -es 'any(.[]; .Action == "pass" and
                .Package == "github.com/mithileshchellappan/pushboy/internal/storage" and
                .Test == "TestPostgresLegacyPublishJob")' "$results" > /dev/null; then
              echo "::error::TestPostgresLegacyPublishJob did not pass"
              return 1
            fi
          }

          run_go_tests
          run_go_tests -race

      - name: Vet
        run: go vet ./...

      - name: Build binary
        run: go build -trimpath -o /tmp/pushboy ./cmd/pushboy

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate OpenAPI document
        run: npx --yes @redocly/cli@2.30.6 lint --format=github-actions docs/openapi.yaml

  containers:
    name: Docker and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
      COMPOSE_DISABLE_ENV_FILE: "true"
      COMPOSE_PROJECT_NAME: pushboy-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test installer settings
        run: sh scripts/test-setup.sh

      - name: Build and start Compose stack
        run: docker compose up -d --build

      - name: Smoke test API
        shell: bash
        run: |
          api=http://127.0.0.1:18080/v1
          app_container="$(docker compose ps -aq pushboy)"

          ready=0
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Status}}' "$app_container")"
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              echo "pushboy container exited before becoming healthy"
              exit 1
            fi

            if curl -fsS "$api/ping" | grep -qx "pong"; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "pushboy did not respond to /v1/ping in time"
            exit 1
          fi

          user_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS "$api/users/" \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"${user_id}\"}" | jq -e --arg id "$user_id" '.ID == $id'
          curl -fsS "$api/users/$user_id" | jq -e --arg id "$user_id" '.ID == $id'
          curl -fsS "$api/topics/" | jq -e 'any(.[]; .ID == "broadcast")'

          docker compose exec -T postgres sh -ec '
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT version > 0 AND NOT dirty FROM schema_migrations;"
          ' | grep -qx t

      - name: Show Compose status
        if: always()
        run: docker compose ps

      - name: Show Compose logs
        if: always()
        run: docker compose logs --no-color postgres pushboy

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
